[package]
name = "sound-control"
version = "0.1.0"
edition = "2024"

[dependencies]
audio-core = { path = "../audio-core" }
audio-classifier = { path = "../audio-classifier" }
app-tray = { path = "../app-tray" }
slint = "1.3"
tray-icon = "0.13"
i-slint-backend-winit = "1.8"
anyhow = "1.0"

[build-dependencies]
slint-build = "1.3"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58"
features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
]